server:
  port: 8080

spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/dash?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: dash
    password: dash123
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

app:
  jwt:
    secret: change-me-to-a-long-random-string
    issuer: backend
    expire-seconds: 7200

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.baomidou.mybatisplus: info
