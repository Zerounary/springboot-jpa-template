server:
  port: 8080
  ssl:
    enabled: false
    enabled-protocols: TLSv1.1,TLSv1.2,TLSv1.3
    key-store-type: JKS
    key-store: classpath:domain.jks
    key-store-password: pwd123
    ciphers: ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4:!DH:!DHE

spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/dash?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: dash
    password: dash123
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

app:
  jwt:
    secret: change-me-to-a-long-random-string
    issuer: backend
    expire-seconds: 7200

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.baomidou.mybatisplus: info
